name: Projet 6 workflow
on: [push, pull_request]

env:
  ANGULAR_DIR: "Application_Angular/"
  JAVA_DIR: "Application_Java/"

jobs:
  test:
    runs-on: ubuntu-latest
      
    steps:
      - uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Application_Angular/package-lock.json'
          
      - name: Setup Angular
        run: npm ci
        working-directory: Application_Angular/
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lancement du script Python des tests
        run: python run-tests.py $ANGULAR_DIR $JAVA_DIR

      - name: Rapport de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-de-tests
          path: "**/test-results/*.xml"

  build:
    runs-on: ubuntu-latest

    needs: test

    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Docker build Angular image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/app-angular:${{ github.ref_name }}-${{ github.sha }} Application_Angular/

      - name: Docker push Angular image
        run: docker push ghcr.io/${{ github.repository_owner }}/app-angular:${{ github.ref_name }}-${{ github.sha }}

      - name: Docker build Java image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/app-java:${{ github.ref_name }}-${{ github.sha }} Application_Java/

      - name: Docker push Java image
        run: docker push ghcr.io/${{ github.repository_owner }}/app-java:${{ github.ref_name }}-${{ github.sha }}
